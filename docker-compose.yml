# NAS deployment — 2-tier topology (edge/Cloudflare is out of scope of this file):
#
#   app  (front + back, FastAPI/HTMX)  ── reachable from the tunnel/host
#   postgres + chroma (data tier)      ── "data_tier" network only, no published
#                                          ports, no route to the internet
#
# Launch with Doppler so POSTGRES_PASSWORD/APP_PASSWORD/SESSION_SECRET/
# OPENAI_API_KEY never touch disk in cleartext:
#
#   doppler run -- docker compose up -d --build
#
# Point cloudflared (run separately, outside this file) at http://localhost:8090.

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8090:8090" # localhost only: cloudflared is the sole way in (no LAN bypass of Access)
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: rag_bachelor
      POSTGRES_USER: rag_bachelor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set via Doppler}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      DEFAULT_LLM_PROVIDER: openai
      # Fail closed: the app refuses to start unless Doppler delivered APP_PASSWORD, instead of
      # silently serving the course content with no login (e.g. DOPPLER_TOKEN missing).
      REQUIRE_AUTH: "true"
      # OPENAI_API_KEY / APP_PASSWORD / SESSION_SECRET / SESSION_COOKIE_SECURE
      # come from Doppler (see docker/entrypoint.sh) — do not hardcode here.
    volumes:
      - pdfs:/app/data/pdfs
      - model_cache:/app/model_cache
    depends_on:
      - postgres
      - chroma
    networks:
      - default
      - data_tier
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"} # a chatty container can't fill the NAS disk
    cap_drop: [ALL] # non-root on port 8090: needs no Linux capabilities
    security_opt: ["no-new-privileges:true"]
    # Code and libs can't be modified at runtime; writes go to the volumes above or /tmp
    # (uploads spooled by FastAPI, HOME caches). tmpfs counts against the memory limit.
    read_only: true
    tmpfs:
      - /tmp:size=512m,nosuid,nodev
    pids_limit: 256
    deploy:
      resources:
        limits:
          # bge-m3 + bge-reranker + torch ≈ 5 GB resident, + Docling layout/table models
          # during indexing, + the /tmp tmpfs; tune to the NAS RAM.
          memory: 8G

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rag_bachelor
      POSTGRES_USER: rag_bachelor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set via Doppler}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data_tier
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"} # a chatty container can't fill the NAS disk
    # Entrypoint starts as root, fixes data-dir ownership, then drops to `postgres`:
    # only the capabilities that needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    pids_limit: 256
    deploy:
      resources:
        limits:
          memory: 1G
    # No "ports:" — unreachable from the LAN or the internet, only from `app`.

  chroma:
    # image en production depuis le 23.08.2026, construite le 2026-05-05 ; version exacte non
    # identifiée ; épinglée par digest pour garder chroma_data lisible.
    # Compatibilité vérifiée en production le 2026-10-04 : client chromadb 1.5.9
    # (rag-bachelor-app-1) contre ce serveur.
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - data_tier
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"} # a chatty container can't fill the NAS disk
    cap_drop: [ALL] # port 8000, own data dir: needs no Linux capabilities
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    deploy:
      resources:
        limits:
          memory: 2G
    # No "ports:" — same isolation as postgres.

networks:
  default:
  data_tier:
    internal: true # no route out of this network at all, including to the internet

volumes:
  postgres_data:
  chroma_data:
  pdfs:
  model_cache:
