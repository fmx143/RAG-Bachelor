<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bachelor — Assistant de révision</title>
  <link rel="stylesheet" href="{{ asset_url('app.css') }}">
  <script src="{{ asset_url('htmx.min.js') }}" defer></script>
  <script src="{{ asset_url('app.js') }}" defer></script>
</head>
<body>
<a href="#main-content" class="skip-link">Aller au contenu principal</a>
<div class="shell">
  {% block decor %}{% endblock %}
  <div style="position:relative;">
  <header class="site-header rise">
    <a href="/docs" class="brand">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="3" fill="#F2B66D"/><circle cx="4" cy="6" r="2" fill="#7FD1C7"/><circle cx="22" cy="8" r="2" fill="#7FD1C7"/><circle cx="19" cy="21" r="2" fill="#7FD1C7"/><path d="M13 13L4 6M13 13L22 8M13 13L19 21" stroke="#F2B66D" stroke-opacity=".6"/></svg>
      Bachelor
      <span class="provider-badge">{{ provider_label }}</span>
    </a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="/docs"     class="nav-link {% if active_tab == 'docs'     %}active{% endif %}">Documents</a>
      <a href="/ask"      class="nav-link {% if active_tab == 'ask'      %}active{% endif %}">Demander</a>
      <a href="/revision" class="nav-link {% if active_tab == 'revision' %}active{% endif %}">Réviser</a>
      <a href="/generate" class="nav-link {% if active_tab == 'generate' %}active{% endif %}">Générer</a>
      <a href="/bank"     class="nav-link {% if active_tab == 'bank'     %}active{% endif %}">Banque</a>
      <a href="/sheets"   class="nav-link {% if active_tab == 'sheets'   %}active{% endif %}">Fiches</a>
      <a href="/progress" class="nav-link {% if active_tab == 'progress' %}active{% endif %}">Progrès</a>
      <a href="/settings" class="nav-link {% if active_tab == 'settings' %}active{% endif %}">Paramètres</a>
      {% if auth_enabled() %}
      <a href="/logout" class="nav-link">Déconnexion</a>
      {% endif %}
    </nav>
  </header>

  <main id="main-content" class="main">
    {% block content %}{% endblock %}
  </main>
  </div>
</div>
</body>
</html>
