{# Flag a badly made card (same click again clears it) + delete. `rated` = -1 or none. #}
<div class="rate-row" id="rate-row">
  <button type="button" class="btn btn-ghost btn-sm{% if rated == -1 %} on{% endif %}" aria-pressed="{{ 'true' if rated == -1 else 'false' }}"
    hx-post="/revision/rate/{{ card.id }}" hx-vals='{"value": "-1"}' hx-target="#rate-row" hx-swap="outerHTML">Mal conçue</button>
  <button type="button" class="btn btn-danger btn-sm" hx-post="/revision/delete/{{ card.id }}" hx-include="#revision-filter-form"
    hx-confirm="Supprimer cette carte et sa question de la banque ? Son historique est perdu."
    hx-target="#revision-content" hx-swap="innerHTML">Supprimer</button>
</div>
